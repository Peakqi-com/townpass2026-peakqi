<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" role="img" aria-label="M12 補助小幫手：先問幫誰看，再用三題篩出「可能可以申請」">
<title>M12 補助小幫手：先問幫誰看，再用三題篩出「可能可以申請」</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#738995"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#738995"/></marker>
</defs>
<rect x="1" y="1" width="1078" height="858" rx="20" fill="white" stroke="#E3E7E9" stroke-width="2"/>
<rect x="1" y="1" width="1078" height="6" rx="3" fill="#5AB4C5"/>
<text x="32.0" y="38.0" font-size="20" font-weight="700" fill="#30383D" text-anchor="start" dominant-baseline="central">M12 補助小幫手：先問幫誰看，再用三題篩出「可能可以申請」</text><text x="32.0" y="64.0" font-size="13" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">答案只存在手機裡，不上傳；只說「可能可以申請」，最後由社會局審核</text>
<path d="M540,148.5 V172 M270,172 H810" fill="none" stroke="#91A0A8" stroke-width="1.8"/>
<path d="M270.0,172.0 L270.0,210.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M810.0,172.0 L810.0,196.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M810.0,275.5 L810.0,299.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M270,289.5 V392 M810,360.5 V392 M190,392 H890" fill="none" stroke="#91A0A8" stroke-width="1.8"/>
<path d="M190.0,392.0 L190.0,415.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M540.0,392.0 L540.0,415.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M890.0,392.0 L890.0,424.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M190,494.5 V528 M540,494.5 V528 M890,485.5 V528 M190,528 H890" fill="none" stroke="#91A0A8" stroke-width="1.8"/>
<path d="M190.0,528.0 L190.0,560.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M540.0,528.0 L540.0,569.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M890.0,528.0 L890.0,569.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M190.0,639.5 L190.0,678.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M540.0,721.5 L540.0,759.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="390.0" y="87.5" width="300.0" height="61.0" rx="30.5" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="540.0" y="109.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">您是幫誰看？</text>
<text x="540.0" y="128.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">幫我自己／幫另一半或家人</text>
<rect x="70.0" y="210.5" width="400.0" height="79.0" rx="12.0" fill="#F1F3F4" stroke="#CAD1D5" stroke-width="1.5"/>
<text x="270.0" y="232.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">自動帶入（不用問）</text>
<text x="270.0" y="251.5" font-size="12.5" font-weight="400" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">年齡・原住民身分（門檻降 10 歲）</text>
<text x="270.0" y="269.5" font-size="12.5" font-weight="400" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">行政區・市民身分 ← 台北通帳號</text>
<rect x="600.0" y="196.5" width="420.0" height="79.0" rx="12.0" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="810.0" y="218.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">他（她）今年幾歲？</text>
<text x="810.0" y="237.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">未滿 55 歲／55～64 歲／65 歲以上／不知道</text>
<text x="810.0" y="255.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">行政區、市民身分沿用您的（當作住同一戶）</text>
<rect x="600.0" y="299.5" width="420.0" height="61.0" rx="12.0" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="810.0" y="321.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">選 55～64 歲時才問：是原住民嗎？</text>
<text x="810.0" y="340.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">原住民有些補助 55 歲就可以申請</text>
<rect x="30.0" y="415.5" width="320.0" height="79.0" rx="12.0" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="190.0" y="437.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">① 有身心障礙證明嗎？</text>
<text x="190.0" y="456.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">有 → 看不清楚／聽不清楚／其他</text>
<text x="190.0" y="474.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">沒有・不知道</text>
<rect x="380.0" y="415.5" width="320.0" height="79.0" rx="12.0" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="540.0" y="437.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">② 家裡收入</text>
<text x="540.0" y="456.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">有低收或中低收證明</text>
<text x="540.0" y="474.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">沒有，但收入不高・不知道</text>
<rect x="730.0" y="424.5" width="320.0" height="61.0" rx="12.0" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="890.0" y="446.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">③ 家裡有人需要別人照顧嗎？</text>
<text x="890.0" y="465.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">要・不要・不知道</text>
<rect x="30.0" y="560.5" width="320.0" height="79.0" rx="12.0" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
<text x="190.0" y="582.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">您可能可以申請</text>
<text x="190.0" y="601.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">老人津貼・身障生活補助・假牙…</text>
<text x="190.0" y="619.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">收入「不知道」也列出，標「要看家裡收入」</text>
<rect x="380.0" y="569.5" width="320.0" height="61.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="540.0" y="591.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">不用申請，會自動入帳或減免</text>
<text x="540.0" y="610.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">例如已是低收、中低收的身障生活補助</text>
<rect x="730.0" y="569.5" width="320.0" height="61.0" rx="12.0" fill="#FDF3EC" stroke="#FD853A" stroke-width="2"/>
<text x="890.0" y="591.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">答「不知道」的提示</text>
<text x="890.0" y="610.5" font-size="12.5" font-weight="400" fill="#AE501F" text-anchor="middle" dominant-baseline="central">例如照顧題附 1966 按鈕</text>
<rect x="40.0" y="678.5" width="1000.0" height="43.0" rx="12.0" fill="#FFFFFF" stroke="#CAD1D5" stroke-width="1.5"/>
<text x="540.0" y="700.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">每張卡片：一句話＋大約金額・要準備什麼・戶籍地社會課・打電話時的第一句話・家人能不能代辦・申請準備單（可以傳給家人）</text>
<rect x="220.0" y="759.5" width="640.0" height="61.0" rx="12.0" fill="#FDF3EC" stroke="#FD853A" stroke-width="2"/>
<text x="540.0" y="781.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">最後固定一段：沒有找到適合的，或還是不確定？</text>
<text x="540.0" y="800.5" font-size="12.5" font-weight="400" fill="#AE501F" text-anchor="middle" dominant-baseline="central">1957 福利諮詢・1966 長照・文字聯絡；一筆都沒有時，這一段移到最前面</text>
<rect x="238.0" y="180.0" width="64.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="270.0" y="191.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">幫我自己</text>
<rect x="759.2" y="173.0" width="101.5" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="810.0" y="184.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">幫另一半或家人</text>
</svg>
