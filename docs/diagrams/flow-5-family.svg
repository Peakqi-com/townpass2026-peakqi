<text x="32.0" y="38.0" font-size="20" font-weight="700" fill="#30383D" text-anchor="start" dominant-baseline="central">⑤ 家人代設定（M7）</text><text x="32.0" y="64.0" font-size="13" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">設定內容直接編在 QR code 裡，全程不經過伺服器</text>
<rect x="40" y="86" width="1100" height="124" rx="18" fill="#F1F3F4" fill-opacity="0.55" stroke="#CAD1D5" stroke-width="1.5" stroke-dasharray="6 5"/>
