<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="380" viewBox="0 0 1180 380" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" role="img" aria-label="⑦ 看完醫生之後（M4）：回診、領藥提醒">
<title>⑦ 看完醫生之後（M4）：回診、領藥提醒</title>
<defs>
