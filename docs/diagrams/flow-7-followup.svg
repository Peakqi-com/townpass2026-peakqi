<text x="530.0" y="160.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">選日子</text>
<circle cx="455.0" cy="138.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
