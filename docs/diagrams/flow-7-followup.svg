<text x="760.0" y="281.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">都來不及</text>
<text x="760.0" y="300.5" font-size="12.5" font-weight="400" fill="#AE501F" text-anchor="middle" dominant-baseline="central">說明已經過了，不排通知</text>
<rect x="910.0" y="250.5" width="240.0" height="79.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="1030.0" y="272.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">傳給家人知道</text>
<text x="1030.0" y="291.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">簡訊帶好內文，不自動送出</text>
<text x="1030.0" y="309.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">沒設定家人：複製貼到 LINE</text>
<rect x="998.0" y="214.0" width="64.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="1030.0" y="225.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">可以再按</text>
<text x="40.0" y="352.0" font-size="12.5" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">通知內文：「11 月 20 日（星期五）要回診，記得帶健保卡和藥袋。」不寫未查證的健保領藥規則。</text>
