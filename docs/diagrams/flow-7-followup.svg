<circle cx="30.0" cy="129.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
<text x="30.0" y="129.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="230.0" y="129.5" width="200.0" height="61.0" rx="12.0" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="330.0" y="151.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">選回診或領藥</text>
<text x="330.0" y="170.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">慢性病連續處方箋</text>
<circle cx="230.0" cy="129.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
<text x="230.0" y="129.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
