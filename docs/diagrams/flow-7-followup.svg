<text x="760.0" y="161.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">前一天晚上 7 點</text>
<text x="760.0" y="179.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">來不及 → 當天早上 7 點</text>
<circle cx="645.0" cy="120.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
<text x="645.0" y="120.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="920.0" y="129.5" width="220.0" height="61.0" rx="12.0" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
