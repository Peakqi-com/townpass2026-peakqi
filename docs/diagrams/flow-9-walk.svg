<rect x="25.0" y="129.5" width="230.0" height="61.0" rx="12.0" fill="#F1F3F4" stroke="#CAD1D5" stroke-width="1.5"/>
<text x="140.0" y="151.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">首頁公車卡片</text>
<text x="140.0" y="170.5" font-size="12.5" font-weight="400" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">「帶我走到站牌」</text>
<circle cx="25.0" cy="129.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
<text x="25.0" y="129.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="280.0" y="120.5" width="260.0" height="79.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="410.0" y="142.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">取得現在位置</text>
<text x="410.0" y="161.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">台北通 location</text>
<text x="410.0" y="179.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">WebView watchPosition</text>
<circle cx="280.0" cy="120.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
<text x="280.0" y="120.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="555.0" y="120.5" width="270.0" height="79.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="690.0" y="142.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">在手機上算步行路線</text>
<text x="690.0" y="161.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">A*・OSM 路網（會場周邊）</text>
<text x="690.0" y="179.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">樓梯成本加重</text>
<circle cx="555.0" cy="120.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
<text x="555.0" y="120.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="855.0" y="120.5" width="270.0" height="79.0" rx="12.0" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
<text x="990.0" y="142.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">比較走路與公車</text>
<text x="990.0" y="161.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">長輩以 0.8 公尺／秒估算</text>
<text x="990.0" y="179.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">趕不上就說等下一班</text>
<circle cx="855.0" cy="120.5" r="12" fill="#468D9B" stroke="white" stroke-width="2"/>
<text x="855.0" y="120.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="70.0" y="301.5" width="320.0" height="61.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="230.0" y="323.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">轉彎、過馬路前 40 公尺先提醒</text>
<text x="230.0" y="342.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">到了說「現在右轉」＋震動</text>
<rect x="430.0" y="301.5" width="320.0" height="61.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="590.0" y="323.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">過馬路處 30 公尺內有有聲號誌</text>
<text x="590.0" y="342.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">「聽到嗶嗶聲再走」（M10 資料）</text>
<rect x="790.0" y="301.5" width="320.0" height="61.0" rx="12.0" fill="#FDF3EC" stroke="#FD853A" stroke-width="2"/>
<text x="950.0" y="323.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">偏離路線超過 35 公尺</text>
<text x="950.0" y="342.5" font-size="12.5" font-weight="400" fill="#AE501F" text-anchor="middle" dominant-baseline="central">連續 2 次就重新找路</text>
<text x="40.0" y="408.0" font-size="12.5" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">範圍外會說明並給直線距離；「模擬走一次」讓位置沿路線自動前進（桌上測試、決選舞台用）。路線只是參考：過馬路一定要看號誌、走斑馬線。</text>
</svg>
