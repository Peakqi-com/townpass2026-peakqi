<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" role="img" aria-label="⑨ 帶我走到站牌（M16 延伸）">
<title>⑨ 帶我走到站牌（M16 延伸）</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#738995"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#738995"/></marker>
</defs>
<rect x="1" y="1" width="1178" height="438" rx="20" fill="white" stroke="#E3E7E9" stroke-width="2"/>
<rect x="1" y="1" width="1178" height="6" rx="3" fill="#5AB4C5"/>
<text x="32.0" y="38.0" font-size="20" font-weight="700" fill="#30383D" text-anchor="start" dominant-baseline="central">⑨ 帶我走到站牌（M16 延伸）</text><text x="32.0" y="64.0" font-size="13" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">路線在手機上算，不呼叫路線規劃服務；路網打開服務時就預先下載，斷網也能用</text>
