<text x="430.0" y="141.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">fetch /api/opendata/…</text>
<text x="430.0" y="160.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">?q=中山區 或 ?near=緯度,經度</text>
