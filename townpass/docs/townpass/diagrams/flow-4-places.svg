<text x="330.0" y="300.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">斷網或讀不到：說明並給 1999</text>
<rect x="978.0" y="209.0" width="64.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="1010.0" y="220.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">沒有快取</text>
