<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="410" viewBox="0 0 1180 410" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" role="img" aria-label="② 按一顆大按鈕">
<title>② 按一顆大按鈕</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#738995"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#738995"/></marker>
</defs>
<rect x="1" y="1" width="1178" height="408" rx="20" fill="white" stroke="#E3E7E9" stroke-width="2"/>
<rect x="1" y="1" width="1178" height="6" rx="3" fill="#5AB4C5"/>
<text x="32.0" y="38.0" font-size="20" font-weight="700" fill="#30383D" text-anchor="start" dominant-baseline="central">② 按一顆大按鈕</text><text x="32.0" y="64.0" font-size="13" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">每個回饋至少兩種感官：震動＋大字＋聲音；開著報讀軟體時不自己唸，避免唸兩次</text>
<path d="M165.0,150.0 L210.0,150.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M350.0,150.0 L390.0,150.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M590.0,150.0 L620.0,150.0 L620.0,100.0 L645.0,100.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M620.0,150.0 L620.0,200.0 L645.0,200.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M875.0,100.0 L900.0,100.0 L900.0,150.0 L940.0,150.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M875.0,200.0 L900.0,200.0 L900.0,150.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M1040.0,180.5 L1040.0,255.0 L720.0,255.0 L720.0,280.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M880.0,320.0 L1000.0,320.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M560.0,320.0 L430.0,320.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="55.0" y="128.5" width="110.0" height="43.0" rx="21.5" fill="#22474E" stroke="#22474E" stroke-width="2"/>
<text x="110.0" y="150.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">點按</text>
<rect x="210.0" y="119.5" width="140.0" height="61.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="280.0" y="141.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">震動</text>
<text x="280.0" y="160.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">haptic</text>
<rect x="390.0" y="128.5" width="200.0" height="43.0" rx="21.5" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="490.0" y="150.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">報讀軟體開著嗎？</text>
<rect x="645.0" y="69.5" width="230.0" height="61.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="760.0" y="91.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">唸出名稱＋大字</text>
<text x="760.0" y="110.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">speak・role=&quot;status&quot;</text>
<rect x="645.0" y="169.5" width="230.0" height="61.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="760.0" y="191.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">只顯示大字</text>
<text x="760.0" y="210.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">報讀軟體自己會唸</text>
<rect x="940.0" y="119.5" width="200.0" height="61.0" rx="12.0" fill="#EDF8FA" stroke="#5AB4C5" stroke-width="2"/>
<text x="1040.0" y="141.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">需要時先確認</text>
<text x="1040.0" y="160.5" font-size="12.5" font-weight="400" fill="#356C77" text-anchor="middle" dominant-baseline="central">例如撥號確認頁</text>
<rect x="560.0" y="280.5" width="320.0" height="79.0" rx="12.0" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
<text x="720.0" y="302.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">依服務的 action 執行</text>
<text x="720.0" y="321.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">phone_call・1999agree・open_link</text>
<text x="720.0" y="339.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">open_external・切換頁面</text>
<rect x="1000.0" y="298.5" width="120.0" height="43.0" rx="21.5" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
<text x="1060.0" y="320.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">完成</text>
<rect x="70.0" y="280.5" width="360.0" height="79.0" rx="12.0" fill="#FDF3EC" stroke="#FD853A" stroke-width="2"/>
<text x="250.0" y="302.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">打不開時</text>
<text x="250.0" y="321.5" font-size="12.5" font-weight="400" fill="#AE501F" text-anchor="middle" dominant-baseline="central">改用 fallback；聽不清楚模式先給文字管道</text>
<text x="250.0" y="339.5" font-size="12.5" font-weight="400" fill="#AE501F" text-anchor="middle" dominant-baseline="central">失敗訊息留在按鈕下方，不會 4 秒就消失</text>
<rect x="600.5" y="114.0" width="39.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="620.0" y="125.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">沒開</text>
<rect x="600.5" y="167.0" width="39.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="620.0" y="178.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">開著</text>
<rect x="920.5" y="309.0" width="39.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="940.0" y="320.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">成功</text>
<rect x="480.5" y="309.0" width="39.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="500.0" y="320.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">失敗</text>
</svg>
