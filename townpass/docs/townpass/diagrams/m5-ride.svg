<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" role="img" aria-label="M5 我要叫車：最多兩題就分流">
<title>M5 我要叫車：最多兩題就分流</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#738995"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#738995"/></marker>
</defs>
<rect x="1" y="1" width="1078" height="468" rx="20" fill="white" stroke="#E3E7E9" stroke-width="2"/>
<rect x="1" y="1" width="1078" height="6" rx="3" fill="#5AB4C5"/>
<text x="32.0" y="38.0" font-size="20" font-weight="700" fill="#30383D" text-anchor="start" dominant-baseline="central">M5 我要叫車：最多兩題就分流</text><text x="32.0" y="64.0" font-size="13" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">復康巴士只限有身障證明的人搭；不知道也有路可走</text>
<path d="M295.0,190.0 L470.0,190.0 L470.0,140.0 L630.0,140.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M170.0,220.5 L170.0,300.5" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M295.0,340.0 L470.0,340.0 L470.0,250.0 L630.0,250.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M470.0,340.0 L630.0,340.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M470.0,340.0 L470.0,430.0 L630.0,430.0" fill="none" stroke="#91A0A8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45.0" y="159.5" width="250.0" height="61.0" rx="30.5" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="170.0" y="181.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">有身心障礙證明嗎？</text>
<text x="170.0" y="200.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">有／沒有／不知道</text>
<rect x="45.0" y="300.5" width="250.0" height="79.0" rx="12.0" fill="#FDF8ED" stroke="#F5BA4B" stroke-width="2"/>
<text x="170.0" y="322.0" font-size="15" font-weight="700" fill="#3C2B0B" text-anchor="middle" dominant-baseline="central">家裡申請過長照，</text>
<text x="170.0" y="341.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">2 級以上嗎？</text>
<text x="170.0" y="359.5" font-size="12.5" font-weight="400" fill="#AD7B2B" text-anchor="middle" dominant-baseline="central">是／不是／不知道</text>
<rect x="630.0" y="109.5" width="380.0" height="61.0" rx="12.0" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
<text x="820.0" y="131.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">復康巴士</text>
<text x="820.0" y="150.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">預約網站・電話訂車（8:00–17:00 受理）</text>
<rect x="630.0" y="219.5" width="380.0" height="61.0" rx="12.0" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
<text x="820.0" y="241.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">長照交通接送</text>
<text x="820.0" y="260.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">每月給付上限 1,680 元</text>
<rect x="630.0" y="309.5" width="380.0" height="61.0" rx="12.0" fill="#5AB4C5" stroke="#5AB4C5" stroke-width="2"/>
<text x="820.0" y="331.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">敬老愛心計程車</text>
<text x="820.0" y="350.5" font-size="12.5" font-weight="400" fill="#EDF8FA" text-anchor="middle" dominant-baseline="central">撥 55850，接通後按 0；每趟最多扣 85 點</text>
<rect x="630.0" y="399.5" width="380.0" height="61.0" rx="12.0" fill="#FDF3EC" stroke="#FD853A" stroke-width="2"/>
<text x="820.0" y="421.0" font-size="15" font-weight="700" fill="#30383D" text-anchor="middle" dominant-baseline="central">先問 1966，也先列出敬老計程車</text>
<text x="820.0" y="440.5" font-size="12.5" font-weight="400" fill="#AE501F" text-anchor="middle" dominant-baseline="central">長照等級不確定時，由 1966 幫忙查</text>
<rect x="516.8" y="129.0" width="26.5" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="530.0" y="140.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">有</text>
<rect x="125.5" y="251.0" width="89.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="170.0" y="262.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">沒有、不知道</text>
<rect x="516.8" y="239.0" width="26.5" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="530.0" y="250.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">是</text>
<rect x="540.5" y="329.0" width="39.0" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="560.0" y="340.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">不是</text>
<rect x="519.2" y="419.0" width="51.5" height="22" rx="11" fill="white" stroke="#E3E7E9"/>
<text x="545.0" y="430.0" font-size="12.5" font-weight="600" fill="#5E6D76" text-anchor="middle" dominant-baseline="central">不知道</text>
<text x="40.0" y="452.0" font-size="12.5" font-weight="400" fill="#738995" text-anchor="start" dominant-baseline="central">聽不清楚模式：結果是只能打電話的服務時，另外給「手語視訊轉譯」</text>
</svg>
